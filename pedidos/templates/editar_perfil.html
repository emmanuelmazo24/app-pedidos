{% extends 'base.html' %}

{% block content %}
<main class="container">
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="card" style="width: 25rem; margin: 20px;">
        <div class="card-body">
          <h5 class="card-title">Cambiar perfil</h5> 
          <div class="alert alert-danger {% if not error %}d-none {%endif%}" role="alert">    
            {{error}}
          </div>          
          <form action="{% url 'editar_perfil'%}" method="POST">
            {% csrf_token %}
              {% for field in form %}
              <div class="mb-3">                
                <label for="{{field.id_for_label}}" class="form-label"><strong>{{ field.label }}</strong></label>
                {{ field }}
                {% if field.errors %}
                  <div class="text-danger">{{ field.errors }}</div>
                {% endif %}
              </div>
              {% endfor %}            
            <button class="btn btn-primary mb-3" type="submit">
              Actualizar Perfil
            </button>
          </form>                   
        </div>
      </div>
    </div>    
</main>
{% endblock %}
