{% extends 'base.html' %}

{% block content %}
<main class="container">
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="card" style="width: 25rem; margin: 20px;">
        <div class="card-body">
          <h5 class="card-title">Perfil del Usuario</h5> 
          <div class="alert alert-danger {% if not error %}d-none {%endif%}" role="alert">    
            {{error}}
          </div>
          <div class="mb-3">
            <label for="user" class="form-label">Usuario</label>            
            <input type="text" class="form-control" id="user" name="user" value = "{{user.username}}" readonly>
          </div>         
          <div class="mb-3">
            <label for="user_name" class="form-label">Nombre Usuario</label>
            <input type="text" class="form-control" id="user_name" name="user_name" value = "{{user.first_name}} {{user.last_name }}" readonly>
          </div> 
          <div class="mb-3">
            <a href="{% url 'editar_perfil' %}" class="btn btn-primary">Editar perfil</a>
            <a href="{% url 'update_password' %}"  class="btn btn-primary">Cambiar Contraseña</a>
          </div>  
          {% if messages %}
            <ul class="mt-3">
              {% for message in messages %}
                <li class="text-success">{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}             
        </div>
      </div>
    </div>    
</main>
{% endblock %}
